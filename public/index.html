<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>rony.ai</title>
<style>
:root{--bg:#0b0b12;--s:#14141f;--s2:#1c1c2b;--b:#26263a;--t:#ececf5;--m:#8686a3;--a:#7c6dff;--a2:#ff6b9d;--err:#ff8585}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--t);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.logo{width:34px;height:34px;border-radius:10px;padding:6px;background:linear-gradient(135deg,var(--a),var(--a2));flex:none}
.logo svg{width:100%;height:100%;fill:#fff}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.btn{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.ghost{background:var(--s2);border:1px solid var(--b);font-weight:500}
input,textarea,select{background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:10px 12px;width:100%}
/* auth */
#auth{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:5;padding:16px}
.card{width:min(390px,100%);background:var(--s);border:1px solid var(--b);border-radius:16px;padding:28px;display:grid;gap:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--s2);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;color:var(--m)}
.tabs button.on{background:var(--b);color:var(--t)}
#authForm{display:grid;gap:12px}
#authErr{color:var(--err);font-size:.85rem;min-height:1.2em}
/* app */
#app{display:none;height:100%}
#app.on{display:flex}
#side{width:250px;background:var(--s);border-right:1px solid var(--b);padding:16px 12px;display:flex;flex-direction:column;gap:10px}
#hist{flex:1;overflow:auto;display:grid;gap:2px;align-content:start}
.h{padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.88rem}
.h:hover,.h.on{background:var(--s2);color:var(--t)}
.me{border-top:1px solid var(--b);padding-top:12px;display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--m)}
.me button{background:none;border:0;color:var(--m);cursor:pointer;text-decoration:underline}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--b)}
#top select{width:auto;max-width:55%}
#msgs{flex:1;overflow:auto;padding:24px 20px}
.wrap{max-width:780px;margin:0 auto;display:grid;gap:20px}
.row{display:flex;gap:12px}
.row.user{flex-direction:row-reverse}
.bub{max-width:80%;padding:12px 16px;border-radius:14px;background:var(--s);border:1px solid var(--b);overflow-wrap:anywhere}
.row.user .bub{background:var(--s2)}
.row.err .bub{border-color:var(--err);color:var(--err)}
.bub img{max-width:100%;border-radius:10px;display:block}
.bub pre{background:#07070c;border:1px solid var(--b);border-radius:8px;padding:12px;overflow:auto;margin:8px 0;font-size:.85rem}
.bub code{font-family:ui-monospace,Menlo,Consolas,monospace}
.empty{text-align:center;margin-top:12vh;display:grid;gap:10px;justify-items:center}
.empty .logo{width:64px;height:64px;padding:12px;border-radius:18px}
.empty h1{font-size:1.8rem;letter-spacing:-.03em}
.empty p{color:var(--m)}
#bar{padding:14px 20px 18px;border-top:1px solid var(--b)}
#bar .wrap{display:flex;gap:10px;align-items:flex-end}
#in{resize:none;max-height:150px}
@media(max-width:700px){#side{display:none}.bub{max-width:92%}}
@media(prefers-reduced-motion:no-preference){.dots{animation:p 1s infinite}@keyframes p{50%{opacity:.35}}}
</style>
</head>
<body>

<div id="auth">
  <div class="card">
    <div class="brand"><div class="logo"></div>rony.ai</div>
    <div class="tabs"><button id="tLogin" class="on" type="button">Log in</button><button id="tSignup" type="button">Sign up</button></div>
    <form id="authForm">
      <input id="aName" placeholder="Your name" autocomplete="name" hidden>
      <input id="aEmail" type="email" placeholder="Email" autocomplete="email" required>
      <input id="aPass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" required>
      <div id="authErr" role="alert"></div>
      <button class="btn" id="aGo">Log in</button>
    </form>
  </div>
</div>

<div id="app">
  <aside id="side">
    <div class="brand"><div class="logo"></div>rony.ai</div>
    <button class="btn" id="newBtn">New chat</button>
    <div id="hist"></div>
    <div class="me"><span id="who"></span><button id="out">Log out</button></div>
  </aside>
  <main id="main">
    <div id="top"><button class="btn ghost" id="newBtn2">New chat</button><select id="model" aria-label="Model"></select></div>
    <div id="msgs"><div class="wrap" id="list"></div></div>
    <div id="bar"><div class="wrap">
      <textarea id="in" rows="1" placeholder="Message rony.ai. Type /imagine to make an image."></textarea>
      <button class="btn" id="send">Send</button>
    </div></div>
  </main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const LOGO = '<svg viewBox="0 0 716 716"><path d="M508.749 317.399C516.777 287.314 508.991 253.884 485.389 230.282C461.788 206.681 428.36 198.895 398.273 206.923C376.231 184.928 343.39 174.956 311.148 183.596C278.906 192.234 255.45 217.292 247.36 247.361C217.291 255.451 192.233 278.91 183.595 311.149C174.957 343.391 184.927 376.232 206.924 398.274C198.896 428.359 206.683 461.789 230.284 485.391C253.885 508.992 287.313 516.779 317.401 508.75C339.442 530.745 372.286 540.717 404.525 532.079C436.767 523.441 460.223 498.384 468.313 468.315C498.383 460.224 523.44 436.766 532.078 404.526C540.716 372.285 530.747 339.443 508.749 317.402V317.399ZM470.899 244.776C486.892 260.77 493.488 282.601 490.687 303.412L415.577 260.046C412.411 258.218 408.509 258.218 405.345 260.046L317.401 310.82V277.526C317.401 275.191 318.652 273.005 320.676 271.837L387.644 233.174C414.178 218.353 448.346 222.223 470.901 244.776H470.899ZM357.837 311.144L398.275 334.491V381.185L357.837 404.532L317.398 381.185V334.491L357.837 311.144ZM264.776 269.693C265.207 239.305 285.644 211.649 316.453 203.393C338.3 197.54 360.505 202.744 377.127 215.573L302.014 258.937C298.848 260.764 296.898 264.144 296.898 267.798V369.346L268.065 352.699C266.043 351.531 264.776 349.353 264.776 347.017V269.691V269.693ZM203.391 316.454C209.244 294.608 224.854 277.978 244.276 269.999V356.73C244.276 360.384 246.226 363.763 249.392 365.591L337.337 416.365L308.503 433.013C306.481 434.181 303.961 434.188 301.939 433.02L234.971 394.357C208.868 378.789 195.138 347.261 203.391 316.454ZM244.775 470.9C228.781 454.906 222.186 433.075 224.986 412.264L300.096 455.63C303.263 457.457 307.164 457.457 310.328 455.63L398.273 404.856V438.149C398.273 440.485 397.022 442.671 394.997 443.839L328.029 482.502C301.495 497.322 267.327 493.452 244.772 470.9H244.775ZM450.897 445.982C450.466 476.371 430.029 504.027 399.22 512.283C377.373 518.136 355.168 512.932 338.547 500.102L413.659 456.738C416.826 454.911 418.775 451.532 418.775 447.877V346.329L447.609 362.977C449.631 364.145 450.897 366.323 450.897 368.659V445.985V445.982ZM512.282 399.221C506.429 421.068 490.819 437.697 471.397 445.676V358.946C471.397 355.292 469.448 351.912 466.281 350.085L378.336 299.311L407.17 282.663C409.192 281.495 411.712 281.487 413.734 282.655L480.702 321.318C506.805 336.887 520.536 368.415 512.282 399.221Z"/></svg>';
document.querySelectorAll('.logo').forEach((e) => (e.innerHTML = LOGO));

let token = localStorage.getItem('rony_token');
let user = JSON.parse(localStorage.getItem('rony_user') || 'null');
let chats = [], cur = null, busy = false, mode = 'login';

const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function fmt(t) {
  return esc(t)
    .replace(/```\w*\n?([\s\S]*?)```/g, (_, c) => `<pre><code>${c.trim()}</code></pre>`)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>').replace(/(<pre>[\s\S]*?<\/pre>)/g, (m) => m.replace(/<br>/g, '\n'));
}

async function api(url, body, method = 'POST') {
  let r;
  try {
    r = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch {
    throw new Error(location.protocol === 'file:'
      ? 'Open http://localhost:3000 in your browser. Opening this file directly cannot reach the server.'
      : 'Cannot reach the server. Check that it is running.');
  }
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && token && !url.includes('/api/login')) logout();
  if (!r.ok) throw new Error(d.error || 'Request failed (' + r.status + ')');
  return d;
}

/* ── auth ── */
function setMode(m) {
  mode = m;
  $('#tLogin').classList.toggle('on', m === 'login');
  $('#tSignup').classList.toggle('on', m === 'signup');
  $('#aName').hidden = m === 'login';
  $('#aName').required = m === 'signup';
  $('#aGo').textContent = m === 'login' ? 'Log in' : 'Create account';
  $('#aPass').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  $('#authErr').textContent = '';
}
$('#tLogin').onclick = () => setMode('login');
$('#tSignup').onclick = () => setMode('signup');
$('#authForm').onsubmit = async (e) => {
  e.preventDefault();
  $('#aGo').disabled = true; $('#authErr').textContent = '';
  try {
    const d = await api('/api/' + mode, { name: $('#aName').value, email: $('#aEmail').value, password: $('#aPass').value });
    token = d.token; user = d.user;
    localStorage.setItem('rony_token', token); localStorage.setItem('rony_user', JSON.stringify(user));
    start();
  } catch (err) { $('#authErr').textContent = err.message; }
  $('#aGo').disabled = false;
};
function logout() {
  token = null; user = null;
  localStorage.removeItem('rony_token'); localStorage.removeItem('rony_user');
  $('#app').classList.remove('on'); $('#auth').style.display = 'grid';
}
$('#out').onclick = logout;

/* ── chats ── */
const store = () => 'rony_chats_' + user.email;
function save() {
  const clean = chats.map((c) => ({ id: c.id, title: c.title, msgs: c.msgs.filter((m) => !m.err).map((m) => ({ role: m.role, content: m.image ? '(image)' : m.content })) }));
  localStorage.setItem(store(), JSON.stringify(clean.slice(0, 40)));
}
function newChat() {
  if (cur && !cur.msgs.length) return render();
  cur = { id: Date.now(), title: 'New chat', msgs: [] };
  chats.unshift(cur); render();
}
function open(id) { cur = chats.find((c) => c.id === id); render(); }
function render(pending) {
  $('#hist').innerHTML = '';
  chats.filter((c) => c.msgs.length).forEach((c) => {
    const d = document.createElement('div');
    d.className = 'h' + (c === cur ? ' on' : ''); d.textContent = c.title; d.onclick = () => open(c.id);
    $('#hist').appendChild(d);
  });
  const row = (m) => `<div class="row ${m.role}${m.err ? ' err' : ''}">${m.role === 'assistant' && !m.err ? `<div class="logo">${LOGO}</div>` : ''}<div class="bub">${m.image ? `<img src="${m.image}" alt="Generated image">` : fmt(m.content)}</div></div>`;
  $('#list').innerHTML = !cur.msgs.length && !pending
    ? `<div class="empty"><div class="logo">${LOGO}</div><h1>How can I help?</h1><p>Ask anything, or type /imagine and describe a picture.</p></div>`
    : cur.msgs.map(row).join('') + (pending ? row({ role: 'assistant', content: '<span class="dots">Thinking…</span>' }).replace('&lt;span class="dots"&gt;Thinking…&lt;/span&gt;', '<span class="dots">Thinking…</span>') : '');
  $('#msgs').scrollTop = $('#msgs').scrollHeight;
}

async function send() {
  const text = $('#in').value.trim();
  if (!text || busy) return;
  busy = true; $('#send').disabled = true; $('#in').value = ''; $('#in').style.height = 'auto';
  cur.msgs.push({ role: 'user', content: text });
  if (cur.msgs.length === 1) cur.title = text.slice(0, 40);
  render(true);
  try {
    if (text.startsWith('/imagine ')) {
      const d = await api('/api/imagine', { prompt: text.slice(9) });
      cur.msgs.push({ role: 'assistant', content: '', image: d.image });
    } else {
      const history = cur.msgs.filter((m) => m.content && !m.err && !m.image);
      const d = await api('/api/chat', { messages: history, model: $('#model').value });
      cur.msgs.push({ role: 'assistant', content: d.reply });
    }
  } catch (err) { cur.msgs.push({ role: 'assistant', content: err.message, err: true }); }
  busy = false; $('#send').disabled = false; save(); render(); $('#in').focus();
}

$('#send').onclick = send;
$('#newBtn').onclick = $('#newBtn2').onclick = newChat;
$('#in').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
$('#in').addEventListener('input', (e) => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 150) + 'px'; });

async function start() {
  $('#auth').style.display = 'none'; $('#app').classList.add('on');
  $('#who').textContent = user.name;
  try { chats = JSON.parse(localStorage.getItem(store()) || '[]'); } catch { chats = []; }
  cur = null; newChat();
  try {
    const m = await api('/api/models', null, 'GET');
    $('#model').innerHTML = m.models.map((id) => `<option value="${id}"${id === m.default ? ' selected' : ''}>${id}</option>`).join('');
  } catch (err) { $('#model').innerHTML = '<option value="">(default model)</option>'; }
}

if (location.protocol === 'file:') $('#authErr').textContent = 'Open http://localhost:3000 instead of this file.';
if (token && user) start();
</script>
</body>
</html>
